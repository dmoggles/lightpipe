services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lightpipe
      POSTGRES_USER: lightpipe
      POSTGRES_PASSWORD: lightpipe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightpipe -d lightpipe"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - lightpipe-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    command:
      - lightpipe
      - --backend
      - postgresql://lightpipe:lightpipe@postgres/lightpipe
      - db
      - upgrade
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command:
      - lightpipe
      - --backend
      - postgresql://lightpipe:lightpipe@postgres/lightpipe
      - serve
      - examples.scrape_and_predict:scrape_and_predict
      - --workers
      - "0"
      - --host
      - 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build: .
    command:
      - lightpipe
      - --backend
      - postgresql://lightpipe:lightpipe@postgres/lightpipe
      - worker
      - examples.scrape_and_predict:scrape_and_predict
      - --worker-id
      - compose-worker-1
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  lightpipe-postgres:
