[project]
name = "lightpipeline"
version = "0.2.0"
description = "A lightweight, backend-neutral Python pipeline orchestrator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
postgres = ["alembic>=1.16", "psycopg[binary,pool]>=3.2"]
s3 = ["boto3>=1.35"]
api = ["fastapi>=0.115", "uvicorn>=0.32"]
all = [
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.16",
  "boto3>=1.35",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
  "alembic>=1.16",
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "ty>=0.0.1",
]

[project.scripts]
lightpipe = "lightpipe.cli:main"

[project.entry-points."lightpipe.backends"]
memory = "lightpipe.backends.memory:MemoryBackend"
postgresql = "lightpipe.backends.postgres:PostgresBackend"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgres: requires LIGHTPIPE_TEST_POSTGRES_DSN and a live Postgres database"]

[tool.ty.environment]
python-version = "3.12"
